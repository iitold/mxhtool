name: keepalive

# GitHub disables scheduled workflows after 60 days of repo inactivity, and
# Supabase pauses free projects after 7 days without API activity. This weekly
# job makes a trivial commit so scheduled runs keep firing.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          mkdir -p .github
          echo "keepalive: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --staged --quiet || git commit -m "chore: keepalive"
          git push
